<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Machinery Maintenance">
    <!-- A gear, because that is what the application is about, drawn rather
         than imported so the install icon costs one small file with no
         licence attached. Maskable-safe: everything sits inside the middle
         80%, so a platform that crops to a circle crops only background. -->
    <rect width="512" height="512" rx="96" fill="#2c3e50"/>
    <g transform="translate(256 256)" fill="#f4b942">
        <g>
            <circle r="126" fill="none" stroke="#f4b942" stroke-width="44"/>
            <circle r="34"/>
        </g>
        <g>
            <rect x="-22" y="-186" width="44" height="52" rx="10"/>
            <rect x="-22" y="134" width="44" height="52" rx="10"/>
            <rect x="-186" y="-22" width="52" height="44" rx="10"/>
            <rect x="134" y="-22" width="52" height="44" rx="10"/>
            <rect x="-22" y="-186" width="44" height="52" rx="10" transform="rotate(45)"/>
            <rect x="-22" y="134" width="44" height="52" rx="10" transform="rotate(45)"/>
            <rect x="-186" y="-22" width="52" height="44" rx="10" transform="rotate(45)"/>
            <rect x="134" y="-22" width="52" height="44" rx="10" transform="rotate(45)"/>
        </g>
    </g>
</svg>
