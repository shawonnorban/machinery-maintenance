; machinery-maintenance — development PHP settings
memory_limit = 512M
max_execution_time = 120

; Work order attachments, checklist photos, import/export files
upload_max_filesize = 100M
post_max_size = 110M
max_file_uploads = 40

date.timezone = UTC

; PHP adds X-Powered-By at the SAPI level, below the framework's own
; SecurityHeaders middleware — removing it in middleware does nothing.
expose_php = Off

; Dev: opcache on, with timestamp checks throttled rather than disabled.
;
; revalidate_freq = 0 means "re-stat every file on every request". On Linux
; that is nearly free; across a Windows bind mount each stat costs roughly a
; millisecond, and Laravel touches on the order of a thousand files per
; request. At 2 seconds an edit still appears almost immediately, and repeat
; requests inside that window do no filesystem work at all.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Laravel plus vendor is well over the 10000 default; exceeding it silently
; evicts files and re-compiles them on the next request.
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 256

; The realpath cache resolves every require() path. The 16K default overflows
; on a framework this size, and each miss is another round trip to the mount.
realpath_cache_size = 4096k
realpath_cache_ttl = 600

display_errors = On
error_reporting = E_ALL
log_errors = On
