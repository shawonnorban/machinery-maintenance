# machinery-maintenance — nginx in front of the Laravel API, and (Phase F/H
# of docs/12-Stack-Migration-Implementation-Plan.md) the coexistence point
# between it and the Next.js frontend.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Matches php.ini's upload limits (work order attachments, imports)
    client_max_body_size 110M;

    # Security headers come from the application's SecurityHeaders middleware
    # in every environment, so they're tested rather than only deployed —
    # setting them here too would risk nginx and the app disagreeing.

    # Docker's embedded DNS (127.0.0.11) resolves `frontend` at request time
    # rather than once when nginx starts — required here specifically
    # because the dependency runs the other way (`frontend` depends_on
    # `nginx`, for its own server-side API calls), so nginx routinely starts
    # before the frontend container exists. A bare `proxy_pass
    # http://frontend:3000` would resolve that hostname once at nginx's own
    # startup and fail to start at all when it isn't up yet; the resolver +
    # variable form below defers resolution to when a request actually
    # arrives, so an unready frontend is a 502 on the affected paths, not a
    # crash-looping nginx.
    resolver 127.0.0.11 valid=10s;
    set $frontend_upstream http://frontend:3000;

    # Next.js's own infrastructure — required by ANY cut-over page
    # regardless of which module, so these are live now rather than staged
    # for a per-module Phase H decision:
    #   - /_next/ is every page's own JS/CSS bundle.
    #   - /api/auth/*, /api/broadcast-auth, /api/offline-relay,
    #     /api/files/*, /api/report-jobs/* are the Next.js app's own Route
    #     Handlers (frontend/src/app/api/**) — a BFF layer distinct from
    #     Laravel's `/api/v1/*`, which nginx keeps routing to PHP-FPM
    #     unchanged via the fallthrough `location /` below (nginx's
    #     longest-prefix-match means these two never collide, so no
    #     `/api/v1/` block needs adding here for that to keep working).
    location /_next/ {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/(auth/|broadcast-auth|offline-relay|files/|report-jobs/) {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Per-module cutover (Phase H): add one `location` per path prefix,
    # each proxying to $frontend_upstream exactly like the blocks above,
    # when that module has actually soaked and is ready to serve real
    # traffic from Next.js instead of Blade.
    #
    # Metering — the plan's own first choice (smallest API gap, simple
    # append-only-ledger shape, not on the technician time-critical
    # offline path). Its Blade route is `/meters` (`MeterController`),
    # not `/metering` — the Next.js screens were built under a different
    # path (`frontend/src/app/(app)/metering`), so this is additive
    # (both URLs work) rather than a swap of one path's backend. Blade's
    # own nav/links pointing at `/meters` are unaffected and still work;
    # switching those to `/metering` too, or redirecting one to the
    # other, is a separate decision this block doesn't make on its own.
    location /metering {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
